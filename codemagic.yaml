# Codemagic — build do Psiquê Oráculo para iOS (App Store / TestFlight).
# Compila na nuvem (Mac), sem precisar de Mac próprio.
#
# ANTES DO 1º BUILD (feito no painel do Codemagic, 1x):
#  1) Teams → Integrations → App Store Connect → adicione uma chave de API
#     (gerada em App Store Connect → Users and Access → Integrations → App Store
#      Connect API). Dê um nome à integração e coloque o MESMO nome em
#      `integrations.app_store_connect` abaixo (aqui está "AppStoreConnectKey").
#  2) Em App Store Connect, crie o app com o Bundle ID com.psiqueoraculo
#     (Apps → + → New App). Sem isso o envio pro TestFlight falha.
#
# Depois é só rodar este workflow no Codemagic.

workflows:
  ios-psique:
    name: Psiquê Oráculo iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnectKey   # <-- nome da integração criada no Codemagic
    environment:
      groups:
        - psique_env            # variáveis NEXT_PUBLIC_* (adicionadas no painel do Codemagic)
      vars:
        # Capacitor 8 usa Swift Package Manager → NÃO há .xcworkspace, só .xcodeproj
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.psiqueoraculo"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instala dependências (npm)
        script: npm ci
      - name: Gera o web (export) e sincroniza o iOS
        script: |
          npm run build:app
          npx cap sync ios
      - name: Instala Pods (se houver Podfile — plugins Cordova)
        script: |
          if [ -f ios/App/Podfile ]; then
            cd ios/App && pod install
          else
            echo "Sem Podfile (Capacitor usa Swift Package Manager) — pulando."
          fi
      - name: Assinatura — cria certificado + perfil (App Store) e aplica
        script: |
          keychain initialize
          # Usa NOSSA chave privada (guardada no Codemagic como CERTIFICATE_PRIVATE_KEY),
          # assim o certificado tem chave persistente entre builds (resolve o
          # "Cannot save Signing Certificates without certificate private key").
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Incrementa o build number (evita conflito no TestFlight)
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          NEXT=$(($LATEST + 1))
          cd ios/App && agvtool new-version -all $NEXT
      - name: Build do IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true            # sobe pro TestFlight automaticamente
        # submit_to_app_store: false          # (ligar só quando quiser enviar pra revisão da loja)
